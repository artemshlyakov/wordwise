<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8f4">
    <title>Wordwise — английский через чтение</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Навигация">
        <a class="brand" href="#library" data-action="navigate-library" aria-label="Wordwise — вернуться в библиотеку" title="Вернуться в библиотеку">
          <span class="brand-mark" aria-hidden="true">w.</span>
          <span>wordwise<span class="brand-period">.</span></span>
        </a>

        <div class="sidebar-label">ТВОЯ БИБЛИОТЕКА</div>
        <div class="library-heading">
          <span>Мои книги</span>
          <button class="icon-button" id="add-book-button" type="button" aria-label="Добавить книгу" title="Добавить книгу">+</button>
        </div>
        <nav id="book-list" class="book-list" aria-label="Книги"></nav>
        <button class="sidebar-add" id="sidebar-add-book" type="button"><span aria-hidden="true">+</span> Новая книга</button>

        <div class="sidebar-bottom">
          <div class="storage-note">
            <span class="storage-icon" aria-hidden="true">✳</span>
            <div><strong>Твоя библиотека</strong><span id="storage-count">Пока без слов</span></div>
          </div>
          <button id="export-button" class="side-action" type="button"><span aria-hidden="true">↗</span> Экспортировать данные</button>
          <button id="import-button" class="side-action" type="button"><span aria-hidden="true">↙</span> Импортировать данные</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
          <div class="sidebar-footnote">Данные хранятся только на этом устройстве</div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="breadcrumb"><a class="breadcrumb-home" href="#library" data-action="navigate-library">Библиотека</a><span class="breadcrumb-slash">/</span><strong id="breadcrumb-book">Обзор</strong></div>
          <div class="topbar-actions">
            <span class="local-badge"><span></span> Личное пространство</span>
            <button id="theme-toggle" class="button button-quiet theme-toggle" type="button" aria-label="Включить тёмную тему" title="Включить тёмную тему"><span id="theme-icon" aria-hidden="true">☾</span><span id="theme-label">Тёмная тема</span></button>
            <button id="top-import-button" class="button button-quiet mobile-import" type="button" aria-label="Импортировать данные" title="Импортировать данные"><span aria-hidden="true">↙</span><span class="mobile-import-label">Импорт</span></button>
            <button id="top-export-button" class="button button-quiet" type="button" aria-label="Скачать резервную копию"><span aria-hidden="true">↓</span><span class="top-export-label">Бэкап</span></button>
          </div>
        </header>
        <div id="notice-region" class="notice-region" aria-live="polite"></div>
        <section id="app-content" class="content" aria-live="polite"></section>
      </main>
    </div>
    <div id="dialog-root"></div>
    <script src="app.js"></script>
  </body>
</html>
